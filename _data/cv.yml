- title: Research Experience
  type: time_table
  contents:
    - title: Safe Whole-body Intelligent Robotics Lab (SWIRL)
      institution: Imperial College London
      year: Sep 2025 – Present
      description:
        - Advisor Prof. Stephen James.
        - "Factored Q-Chunking: the slow part of a robot commits for a full action chunk, the fast part re-plans halfway, and each critic scores only its executed actions. Online fine-tuning success 0.102 to 0.327 on an arm and hand, and 0.302 to 0.480 on a mobile base with two arms."
        - "SafeYield: one module on a frozen policy that yields to a person and resumes the task. On 10 BiGym tasks, collisions 78.8% to 1.6% and success 57.6% to 75.6%."
        - "BiGym 2.0: household-manipulation benchmark for a walking Unitree G1, with 20 tasks and 60 human virtual-reality demonstrations per task."
    - title: Research Intern
      institution: PsiBot.AI
      year: Mar 2026 – Aug 2026
      description:
        - Concurrent with SWIRL. Built a VLM critic for reinforcement-learning post-training of an in-house vision-language-action policy on a real dexterous-hand task, folding cardboard shipping boxes.
    - title: Hybrid Robotics Lab
      institution: University of California, Berkeley
      year: Jun 2025 – Oct 2025
      description:
        - Part time. Trained one transformer locomotion policy spanning quadrupeds, bipeds, and humanoids over procedurally varied body shapes.
